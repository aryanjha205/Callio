services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: callio-backend
    env: python
    region: ohio
    buildCommand: "pip install -r backend/requirements.txt && cd backend && alembic upgrade head"
    startCommand: "PYTHONPATH=backend gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: PYTHONPATH
        value: "backend"
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_6JNlX8IZfGHz@ep-jolly-dust-b5x4aw3u-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require"
      - key: JWT_SECRET
        value: "callio_secret_jwt_key_super_secure_production_2026_change_me"
      - key: CORS_ORIGINS
        value: "https://callio-frontend.onrender.com"
      - key: STUN_SERVER
        value: "stun:stun.l.google.com:19302"

  # ── Frontend (Vite Static Site) ───────────────────────────────────────────
  - type: web
    name: callio-frontend
    env: static
    region: ohio
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://callio-backend.onrender.com"
